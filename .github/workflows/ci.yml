name: CI

on:
  pull_request:
  push:
    branches: [main]

# Отменяем устаревшие прогоны на той же ветке: экономит минуты и не мешает мержу.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      # Тесты не обращаются к Telegram и не требуют реального токена:
      # используется локальный fake Telegram API (tests/fake_telegram.py).
      BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiohttp

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest -q

      - name: Migrations upgrade / rollback (PM-06)
        env:
          DATABASE_URL: sqlite+aiosqlite:///ci-data/migrate.db
        run: |
          python -m postmaster.migrate upgrade
          python -m postmaster.migrate version
          python -m postmaster.migrate downgrade
          python -m postmaster.migrate upgrade

  regression-pm:
    # Регрессия PM-03/04/05 и стабилизация PM-06 (включая конкурентные сценарии).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiohttp
      - name: PM regression suite
        run: >
          pytest -q
          tests/test_pm03.py
          tests/test_pm04.py
          tests/test_pm05.py
          tests/test_pm06.py
          tests/test_dialog_flow.py
          tests/test_dialog_service.py
          tests/test_dialog_store.py
