name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Тесты и линтеры (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    env:
      PYTHONPATH: src
      # Тесты используют только fake Telegram API и временные SQLite-файлы.
      BOT_TOKEN: "123456789:AAFakeTokenForTestsOnly_0123456789"
      DATABASE_URL: "sqlite+aiosqlite:///./data/ci.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (линт)
        run: ruff check .

      - name: Ruff (форматирование)
        run: ruff format --check .

      - name: Тесты
        run: python -m pytest -q --timeout=120

  docker:
    name: Проверка Dockerfile и compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка конфигурации compose
        run: docker compose config > /dev/null
